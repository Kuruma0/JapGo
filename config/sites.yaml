# The MVP sites (docs/site-selection.md).
#
# Three contrasting sites in Shizuoka Prefecture, sharing data sources, licence and CRS zone so
# that a difference in model output is attributable to the environment rather than to the data.
#
# Bounding boxes are WGS84 (minlon, minlat, maxlon, maxlat) and deliberately approximate: exact
# extents are settled on first ingest against real PLATEAU coverage. `archetype` is what the split
# validator checks, because held-out sets must cover unseen archetypes and not merely unseen
# cities.

sites_version: 2
zone: 8            # JGD2011 Plane Rectangular Zone 8, matching VIRTUAL SHIZUOKA as published

sites:
  hamamatsu_plain:
    archetype: suburban_plain
    municipality: 浜松市 / 磐田市
    bbox: [137.70, 34.68, 137.80, 34.76]
    # Hamamatsu 浜松市 (22130), FY2023, CityGML v4 — 269 GB. Never staged: members are
    # range-read by mesh code. Iwata (22211) is the other municipality here.
    plateau_url: https://assets.cms.plateau.reearth.io/assets/f0/ed11d3-e112-4d83-bd6f-d5f41ef75c79/22130_hamamatsu-shi_city_2023_citygml_2_op.zip
    note: >
      Flat alluvial plain, regular blocks, medium-density detached housing. The easy case — if a
      model does poorly here the pipeline is broken rather than the hypothesis.
    expected:
      road_density: high
      orientation_entropy: low
      grade: near-zero

  kawanehon_valley:
    archetype: mountain_valley
    municipality: 川根本町
    bbox: [138.05, 35.05, 138.15, 35.15]
    # Kawanehon 川根本町 (22429), FY2023, CityGML v4 — 50 GB.
    plateau_url: https://assets.cms.plateau.reearth.io/assets/8e/2f254d-c3e7-4842-9417-9f053a47203c/22429_kawanehon-cho_city_2023_citygml_2_op.zip
    note: >
      Upper Ōi River valley with the Ōigawa Railway. Settlement pinned to the valley floor, roads
      forced onto contours. The site where the project's thesis is falsifiable: a model that has
      learned "urban implies grid" will produce a grid here and the sensitivity sweep will catch it.
    expected:
      road_density: low
      sinuosity: high
      dead_end_ratio: high

  izu_coast:
    archetype: coastal_constrained
    municipality: 熱海市 / 伊東市
    # v2 (2026-08-11): north edge 35.05 -> 35.16. Atami's PLATEAU coverage runs to lat 35.15,
    # so the previous extent overlapped only a sliver of it (11 of 69 members) — it was aimed at
    # Ito, which has no configured package yet. The south half stays for when Ito (22208) lands.
    bbox: [139.03, 34.90, 139.19, 35.16]
    # Atami 熱海市 (22205), FY2023, CityGML v4. Ito is the other municipality in this archetype
    # and needs its own package (22208) before the northern and southern halves can both build.
    plateau_url: https://assets.cms.plateau.reearth.io/assets/72/490cd0-9f53-4ca2-b4cd-20475dc10030/22205_atami-shi_city_2023_citygml_2_op.zip
    note: >
      Terrain meeting sea. Development compressed into a narrow coastal strip and up steep slopes
      behind it. Tests a different terrain response from the valley: not "follow the corridor" but
      "fill the only available land". A model that has learned one but not the other has learned a
      rule rather than a relationship.
    expected:
      orientation: strongly anisotropic
      density_vs_slope: high density despite high slope

# Default split assignment. Kawanehon is held out because it is the archetype that most
# distinguishes the project, and testing on the easy case would prove nothing.
default_split:
  hamamatsu_plain: train
  izu_coast: val
  kawanehon_valley: test
