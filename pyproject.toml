[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "japgo"
version = "0.1.0"
description = "Engine-independent environmental understanding and procedural reconstruction system, focused on Japan"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Kept deliberately small. Heavy geospatial dependencies live in the `geo` extra so that the
# provenance layer — which gates everything else — can be installed and run anywhere, including
# in CI, without a GDAL toolchain.
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyproj>=3.6",
    "shapely>=2.0",
    "networkx>=3.0",   # graph algorithms. Research doc §3 lists it as adopted and puts
                       # "graph algorithms" on the do-not-reinvent list; APLS and TOPO both
                       # need shortest paths, and a hand-rolled Dijkstra is exactly that.
]

[project.optional-dependencies]
geo = [
    "geopandas>=1.0",
    "rasterio>=1.3",
    "zarr>=2.17",
    "laspy[lazrs]>=2.5",
    "pyarrow>=15",
    "scikit-image>=0.22",  # skeletonisation. Same rule: raster<->vector conversion is on the
                           # do-not-reinvent list, and thinning is where a hand-rolled version
                           # goes subtly wrong — a stray 8-connected diagonal becomes a spurious
                           # junction, and junction count is a headline TOPO term.
    "scipy>=1.11",   # exact Euclidean distance transform; a pure-numpy EDT is O(n) but loops in
                     # Python and costs seconds per tile at 1512^2.
]
ml = [
    # Intentionally unpinned to a CUDA/ROCm build here: the working index URL depends on the
    # outcome of the Phase 0.5 GPU spike (research doc §20.1). See docs/gpu-spike.md.
    "torch>=2.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
japgo = "japgo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
